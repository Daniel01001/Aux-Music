<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<title>Aux</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aux">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem('aux-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a href="#home" class="wordmark" aria-label="Aux home">aux<span class="dot"></span></a>
    <div class="topbar-right">
      <button class="credits" id="creditsBtn" type="button" aria-label="Your credits"><span class="credits-n" id="creditsN">0</span><span>credits</span></button>
      <a href="#you" class="avatar sm" id="meAvatar" aria-label="Your profile"></a>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<!-- Player: one iframe that never moves in the DOM; CSS switches between mini and full. -->
<section id="player" class="player hidden" aria-label="Now playing">
  <div class="player-sheet-head">
    <button class="icon-btn" id="collapseBtn" type="button" aria-label="Minimise player"><svg><use href="#i-down"/></svg></button>
    <span class="sheet-label" id="sheetLabel">Now playing</span>
    <span class="icon-btn ghost"></span>
  </div>
  <div class="video-wrap" id="videoWrap"><div id="yt"></div><img id="artBig" class="art-big" alt=""><div class="tap-audio hidden" id="tapAudio">Tap the video to start the music</div></div>
  <audio id="au" preload="auto" playsinline></audio>
  <div class="player-meta" id="playerMeta">
    <div class="pm-text">
      <div class="pm-title" id="pmTitle">Nothing playing</div>
      <div class="pm-sub" id="pmSub"></div>
    </div>
    <div class="pm-mini-controls">
      <button class="icon-btn" id="miniToggle" type="button" aria-label="Play or pause"><svg><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="miniNext" type="button" aria-label="Next song"><svg><use href="#i-next"/></svg></button>
    </div>
  </div>
  <div class="player-full">
    <div class="pm-actions">
      <a class="link-btn small hidden" id="pmLicense" target="_blank" rel="noopener">Creative Commons licence</a>
      <button class="btn" id="saveBtn" type="button" hidden><svg><use href="#i-plus"/></svg>Save</button>
    </div>
    <div class="progress"><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Song position"><div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div></div>
    <div class="controls">
      <button class="icon-btn lg" id="prevBtn" type="button" aria-label="Previous song"><svg><use href="#i-prev"/></svg></button>
      <button class="play-btn" id="toggleBtn" type="button" aria-label="Play or pause"><svg><use href="#i-play"/></svg></button>
      <button class="icon-btn lg" id="nextBtn" type="button" aria-label="Next song"><svg><use href="#i-next"/></svg></button>
    </div>
    <div class="sync-strip" id="syncStrip"></div>
    <ol class="queue" id="queueList"></ol>
  </div>
</section>

<nav class="tabbar" aria-label="Main">
  <a href="#home" data-tab="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
  <a href="#search" data-tab="search"><svg><use href="#i-search"/></svg><span>Search</span></a>
  <a href="#sync" data-tab="sync"><svg><use href="#i-sync"/></svg><span>Sync</span><i class="badge hidden" id="syncBadge"></i></a>
  <a href="#you" data-tab="you"><svg><use href="#i-user"/></svg><span>You</span></a>
</nav>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c1.2-3.6 4.1-5.5 7.5-5.5s6.3 1.9 7.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a.6.6 0 0 0 .9.5l10.2-6.5a.6.6 0 0 0 0-1L8.9 5a.6.6 0 0 0-.9.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6.2v11.6a.5.5 0 0 0 .8.4l8.4-5.8a.5.5 0 0 0 0-.8L6.8 5.8a.5.5 0 0 0-.8.4z" fill="currentColor"/><rect x="16.5" y="5.5" width="2.2" height="13" rx="1" fill="currentColor"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6.2v11.6a.5.5 0 0 1-.8.4l-8.4-5.8a.5.5 0 0 1 0-.8l8.4-5.8a.5.5 0 0 1 .8.4z" fill="currentColor"/><rect x="5.3" y="5.5" width="2.2" height="13" rx="1" fill="currentColor"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M6 12v6.5A1.5 1.5 0 0 0 7.5 20h9a1.5 1.5 0 0 0 1.5-1.5V12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="/app.js"></script>
</body>
</html>
